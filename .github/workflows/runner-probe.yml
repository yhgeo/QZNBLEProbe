name: Runner Probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Info
        run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true
