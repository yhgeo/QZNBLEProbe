name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project QZNBLEProbe.xcodeproj \
            -scheme QZNBLEProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -60

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/QZNBLEProbe.app
          test -d "$APP" || { echo "构建产物不存在"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry QZNBLEProbe.ipa Payload
          echo "--- IPA 内容 ---"
          unzip -l QZNBLEProbe.ipa | head -20
          ls -lh QZNBLEProbe.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QZNBLEProbe-ipa
          path: QZNBLEProbe.ipa
          retention-days: 30
